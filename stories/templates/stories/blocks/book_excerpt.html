<figure class="book-excerpt">
  <blockquote>{{ value.text|linebreaks }}</blockquote>
  <figcaption>{{ value.author }}, {% if value.link %}<a href="{{ value.link }}" rel="noopener"><cite>{{ value.book_title }}</cite></a>{% else %}<cite>{{ value.book_title }}</cite>{% endif %}{% if value.page %}, {{ value.page }}{% endif %}</figcaption>
</figure>
