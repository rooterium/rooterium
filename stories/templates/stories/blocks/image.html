{% load wagtailimages_tags %}
<figure>
  {% image value.image width-1200 as img %}
  <img src="{{ img.url }}" width="{{ img.width }}" height="{{ img.height }}" alt="{{ value.image.default_alt_text }}" loading="lazy">
  <figcaption>{% if value.caption %}{{ value.caption }} – {% endif %}{{ value.image.credit }} ({{ value.image.licence }})</figcaption>
</figure>
