# Local development setup. Production: compose.prod.yaml (Caddy + GHCR image).

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images expect the volume at /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    env_file: .env
    # Development: apply migrations, then run the auto-reloading dev server.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      # Live code reload; the virtualenv lives in /opt/venv and is not affected.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
