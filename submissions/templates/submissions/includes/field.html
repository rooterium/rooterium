{% load i18n %}
{# One form field: label, error (with text, not colour alone), input, help text. #}
<div class="form-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="optional">({% translate "optional" %})</span>{% endif %}</label>
  {% if field.errors %}
    <p class="field-error" id="{{ field.auto_id }}_error"><strong>{% translate "Error:" %}</strong> {{ field.errors|join:" " }}</p>
  {% endif %}
  {{ field }}
  {% if field.help_text %}<p class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
